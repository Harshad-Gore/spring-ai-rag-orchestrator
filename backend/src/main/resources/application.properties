spring.application.name=spring-ai-rag-orchestrator
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# openai api configuration
spring.ai.openai.base-url=${GROQ_BASE_URL}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${GROQ_MODEL}

# postgresql database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://db.qyyjwqixruivcstalfyv.supabase.co:5432/postgres}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa / hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# versioned database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# auth configuration
app.frontend.origins=${APP_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.issuer=${AUTH_JWT_ISSUER:spring-ai-rag-orchestrator}
app.auth.jwt-secret=${AUTH_JWT_SECRET:dev-only-change-this-secret-before-production-64-characters-min}
app.auth.token-ttl=${AUTH_TOKEN_TTL:PT2H}
app.auth.cookie-name=${AUTH_COOKIE_NAME:auth_token}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.signup.enabled=${SIGNUP_ENABLED:true}
# s3 / supabase storage
app.s3.endpoint=${SUPABASE_S3_ENDPOINT}
app.s3.region=${SUPABASE_S3_REGION}
app.s3.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID}
app.s3.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY}
app.s3.bucket-name=${SUPABASE_S3_BUCKET_NAME:snbnzkura}

# multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# email configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# frontend URL for email links
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# resend email API (used on Render where SMTP ports are blocked)
# When set, emails are sent via Resend HTTP API instead of SMTP
app.resend.api-key=${RESEND_API_KEY:}

# Spring AI Vector Store Configuration (pgvector)
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE
spring.ai.vectorstore.pgvector.table-name=document_embeddings
spring.ai.vectorstore.pgvector.initialize-schema=true

