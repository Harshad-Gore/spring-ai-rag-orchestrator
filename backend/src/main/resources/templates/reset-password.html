<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #080908; color: #c8cdc9; margin: 0; padding: 40px 20px; }
        .container { max-width: 500px; margin: 0 auto; background-color: #111; border: 1px solid #242424; border-radius: 12px; padding: 30px; text-align: center; }
        .logo { color: #dffdee; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        h2 { color: #fff; font-size: 20px; margin-bottom: 16px; }
        p { line-height: 1.6; margin-bottom: 24px; color: #9aa39f; font-size: 14px; }
        .btn { display: inline-block; background-color: #dffdee; color: #080908; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; }
        .btn:hover { background-color: #b9f7d3; }
        .footer { margin-top: 32px; font-size: 12px; color: #657069; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Spring AI Orchestrator</div>
        <h2>Reset your password</h2>
        <p>Hi <span th:text="${name}">User</span>,</p>
        <p>We received a request to reset the password for your account. Click the button below to set a new password.</p>
        <a th:href="${url}" class="btn">Reset Password</a>
        <p class="footer">If you didn't request a password reset, you can safely ignore this email. This link will expire in 1 hour.</p>
    </div>
</body>
</html>
