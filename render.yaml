services:
  - type: web
    name: spring-ai-rag-orchestrator-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_FRONTEND_ORIGINS
        sync: false
      - key: AUTH_JWT_ISSUER
        value: spring-ai-rag-orchestrator
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: "None"
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: "false"
